<ion-content>
  <div class="container">

    <div class="header">
      <div class="app-logo">
        <ion-icon name="construct-outline"></ion-icon>
      </div>
      <h1>Welcome!</h1>
      <p>Choose how you want to continue</p>
    </div>

    <div class="roles">

      <a class="role-card customer" routerLink="/tabs/home">
        <div class="role-icon">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="role-info">
          <h2>Customer</h2>
          <p>Book and track services</p>
        </div>
        <div class="role-arrow">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </a>

      <a class="role-card admin" routerLink="/admin-login">
        <div class="role-icon">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <div class="role-info">
          <h2>Admin</h2>
          <p>Manage orders and technicians</p>
        </div>
        <div class="role-arrow">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </a>

      <a class="role-card technician" routerLink="/technician-login">
        <div class="role-icon">
          <ion-icon name="build-outline"></ion-icon>
        </div>
        <div class="role-info">
          <h2>Technician</h2>
          <p>View and manage assigned jobs</p>
        </div>
        <div class="role-arrow">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </a>

    </div>

    <div class="footer">
      <p>A1 Technician Services © 2026</p>
    </div>

  </div>
</ion-content>
