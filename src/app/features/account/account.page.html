<ion-header>
  <ion-toolbar>
    <ion-title>My Account</ion-title>

    <ion-buttons slot="end">
      <img src="assets/icons/setting.png" class="settings-icon">
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

<!-- PROFILE CARD -->

<div class="profile-card">

  <img src="assets/profile.png" class="profile-img">

  <div class="profile-info">
    <h2>Shraddha Shetty</h2>
    <p>+91 9876543210</p>

    <ion-button size="small" fill="outline" class="edit-btn">
      <ion-icon name="create-outline"></ion-icon>
      Edit Profile
    </ion-button>
  </div>

</div>





<!-- ACCOUNT MENU -->

<ion-list>

  <ion-item routerLink="/tabs/booking" button>
  <img src="assets/icons/booking-1.png" class="menu-icon">
  <ion-label>Booking History</ion-label>
  <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
</ion-item>

 <ion-item button (click)="goToTrackOrder()">
  <img src="assets/icons/track-order.png" class="menu-icon" slot="start" />
  <ion-label>Track Order</ion-label>
</ion-item>

  <ion-item (click)="goToSavedAddress()">
  <img src="assets/icons/Address.png" class="menu-icon">
  <ion-label>Saved Addresses</ion-label>
  <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
</ion-item>



  <ion-item button (click)="goToReview()">
  <img src="assets/icons/rating.png" class="menu-icon">
  <ion-label>Review</ion-label>
</ion-item>

  <ion-item>
    <img src="assets/icons/logout.png" class="menu-icon">
    <ion-label>Logout</ion-label>
  </ion-item>

</ion-list>

</ion-content>
