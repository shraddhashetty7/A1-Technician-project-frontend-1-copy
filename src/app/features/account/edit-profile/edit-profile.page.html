<ion-header>
  <ion-toolbar>
    <ion-title>Edit Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Name</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Phone</ion-label>
    <ion-input [(ngModel)]="phone"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Profile Image URL</ion-label>
    <ion-input [(ngModel)]="image"></ion-input>
  </ion-item>

  <div style="margin-top:20px">

    <ion-button expand="block" color="primary" (click)="save()">
      Save
    </ion-button>

    <ion-button expand="block" color="medium" (click)="close()">
      Cancel
    </ion-button>

  </div>

</ion-content>
