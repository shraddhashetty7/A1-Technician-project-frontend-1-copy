<ion-content>

<div class="signup-container">

  <!-- Title -->
  <h2 class="title">Create Your Account</h2>

  <!-- Google -->
  <ion-button expand="block" class="google-btn">
    <img src="assets/images/google.jpg" class="google-icon">
    Continue with Google
  </ion-button>

  <div class="divider">
    <span>Or sign up with email</span>
  </div>

  <!-- Form -->
  <div class="form-box">

    <!-- Full Name -->
    <ion-item lines="none">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-input placeholder="Full Name"></ion-input>
    </ion-item>

    <!-- Email -->
    <ion-item lines="none">
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-input placeholder="Email"></ion-input>
    </ion-item>

    <!-- Password -->
    <ion-item lines="none">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password">
      </ion-input>

      <ion-icon
        slot="end"
        [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
        (click)="togglePassword()">
      </ion-icon>
    </ion-item>

    <!-- Confirm Password -->
    <ion-item lines="none">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input
        [type]="showConfirmPassword ? 'text' : 'password'"
        placeholder="Confirm Password">
      </ion-input>

      <ion-icon
        slot="end"
        [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"
        (click)="toggleConfirmPassword()">
      </ion-icon>
    </ion-item>

  </div>

  <!-- Register -->
  <ion-button expand="block" class="signup-btn">
    Register
  </ion-button>

  

  <ion-button expand="block" class="login-btn">
    LOGIN
  </ion-button>
  <!-- Terms -->
  <p class="terms">
    By signing up you agree to our
    <span>Terms of Service</span> and
    <span>Privacy Policy</span>
  </p>

</div>

</ion-content>
